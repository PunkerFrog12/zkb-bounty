<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bounties{% endblock %} - zKillboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand bg-body-tertiary mb-3">
  <div class="container">
    <a class="navbar-brand" href="/">zKillboard Bounties</a>
    <form class="d-flex me-auto" action="/search">
      <input class="form-control form-control-sm" name="q" placeholder="Character name or ID" aria-label="Search character">
    </form>
    <ul class="navbar-nav">
      {% if me %}
        <li class="nav-item"><a class="nav-link" href="/account">{{ me_name }}</a></li>
        {% if is_admin %}<li class="nav-item"><a class="nav-link" href="/admin">Payout queue</a></li>{% endif %}
        <li class="nav-item"><a class="nav-link" href="/logout">Log out</a></li>
      {% else %}
        <li class="nav-item"><a class="nav-link" href="/login">Log in with EVE Online</a></li>
      {% endif %}
    </ul>
  </div>
</nav>
<main class="container">
  {% if flash %}<div class="alert alert-info">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
